name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    # Only the offline tests. test_client.py reads the live chain through shared public endpoints: never run it here.
    name: offline tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile server.py test_client.py tests/test_offline.py
      - run: python -I -m unittest discover -s tests -v
