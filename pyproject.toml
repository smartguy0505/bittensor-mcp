[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bittensor-mcp"
dynamic = ["version"]
description = "Read-only MCP server for the Bittensor chain: subnets, metagraphs, neurons, accounts, windowed net TAO flow and the SDK's ~100 chain reads."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Smart Guy" }]
requires-python = ">=3.10,<3.15"
keywords = ["bittensor", "mcp", "model-context-protocol", "subtensor", "tao"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]
# Exact pins: the server uses SDK internals (the read catalog, MCPServer) that change between releases.
dependencies = [
    "bittensor==11.3.0",
    "bittensor-core==0.1.5",
    "mcp==2.3.0",
]

[project.urls]
Homepage = "https://github.com/smartguy0505/bittensor-mcp"
Issues = "https://github.com/smartguy0505/bittensor-mcp/issues"

[project.scripts]
bittensor-mcp = "bittensor_mcp.server:main"

[tool.setuptools]
packages = ["bittensor_mcp"]

[tool.setuptools.dynamic]
version = { attr = "bittensor_mcp.__version__" }
